name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/components/navigation-guard-provider.tsx"
      - "src/components/command-palette.tsx"
      - "src/components/mobile-workspace-dock.tsx"
      - "src/features/dashboard/components/dashboard-quick-start.tsx"
      - "src/components/app-sidebar.tsx"
      - "src/features/capture/components/scan-search-button.tsx"
      - "src/features/settings/screens/settings-screen.tsx"
      - "src/features/orders/**"
      - "src/features/print/**"
      - "src/styles.css"
      - "tests/e2e/print-safari-reliability.spec.ts"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "src/components/navigation-guard-provider.tsx"
      - "src/components/command-palette.tsx"
      - "src/components/mobile-workspace-dock.tsx"
      - "src/features/dashboard/components/dashboard-quick-start.tsx"
      - "src/components/app-sidebar.tsx"
      - "src/features/capture/components/scan-search-button.tsx"
      - "src/features/settings/screens/settings-screen.tsx"
      - "src/features/orders/**"
      - "src/features/print/**"
      - "src/styles.css"
      - "tests/e2e/print-safari-reliability.spec.ts"
      - "package.json"

jobs:
  playwright:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:desktop:mock
      - run: npm run test:e2e:interactions:mock
  print-safari:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e:print-safari:mock
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-safari-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
            screenshots/TASK-20260720-002-print-safari-reliability-fixes
