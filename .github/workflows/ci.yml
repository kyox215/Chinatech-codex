name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      office-v3-test-db:
        image: postgres:17
        env:
          POSTGRES_DB: office_v3_test
          POSTGRES_PASSWORD: office_v3_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d office_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run test
      - name: Verify Office v3 migrations, RLS, candidate scope and request rate
        run: node tests/office-desktop-v3.sql.mjs
        env:
          OFFICE_V3_TEST_OWNER_URL: postgresql://postgres:office_v3_ci_fixture@127.0.0.1:5432/office_v3_test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:controls
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: control-regression-results
          path: |
            test-results/
            .local/ui-proof/controls/
            .local/device-catalog/picker-performance-*.json
            .local/device-catalog/separated-performance-*.json
          include-hidden-files: true
          retention-days: 7
      - name: Preserve browser-native catalog measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-native-performance
          path: |
            .local/device-catalog/picker-performance-*.json
            .local/device-catalog/separated-performance-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - run: npm run build
        env:
          BACKEND_MODE: supabase
          LOCAL_PREVIEW: "0"
      - name: Verify production design and stylesheet order
        run: node scripts/check-ui-production.mjs .next-backend
      - name: Preserve production design verification
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-design-verification
          path: .local/ui-proof/production-design/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
