name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  office-core-and-client:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - name: Verify SDK and workflow recovery checks
        run: |
          test "$(dotnet --version)" = '10.0.401'
          dotnet run --project desktop/office-assistant/CoreTests/CoreTests.csproj -c Release
      - name: Compile both standalone Windows clients
        run: |
          python3 desktop/office-assistant/build.py --dotnet dotnet --rid win-x64
          python3 desktop/office-assistant/build.py --dotnet dotnet --rid win-arm64
      - name: Compile read-only Windows check harness
        run: dotnet publish desktop/office-assistant/WindowsChecks/WindowsChecks.csproj -c Release -r win-arm64 -o .local/office-rebuild-1.0/windows-checks -p:RestoreConfigFile=desktop/office-assistant/NuGet.Config
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify Office release input preparation
        run: python desktop/office-assistant/release/test_prepare.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:controls
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: control-regression-results
          path: |
            test-results/
            .local/ui-proof/controls/
          include-hidden-files: true
          retention-days: 7
      - run: npm run build
        env:
          BACKEND_MODE: supabase
          LOCAL_PREVIEW: "0"
  office-signing-syntax:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse Office signing tools in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'PowerShell 5.1 required' }
          foreach ($name in @('OfficePePayload.ps1','Sign-OfficeRelease.ps1','Test-OfficeAuthenticode.ps1')) {
            $tokens = $null
            $errors = $null
            $file = Join-Path 'desktop/office-assistant/release' $name
            $null = [Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) { throw ($name + ': ' + (($errors | ForEach-Object { $_.ErrorId }) -join ',')) }
            Write-Output ($name + ': syntax passed')
          }
  office-native-layout:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - name: Measure native WPF controls with synthetic inventory
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.401') { throw 'SDK 10.0.401 required' }
          dotnet run --project desktop/office-assistant/UiChecks/UiChecks.csproj -c Release -r win-x64 -p:RestoreConfigFile=desktop/office-assistant/NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native WPF synthetic control renders
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-1.3-native-wpf-fixture-renders
          path: .local/office-1.3-ui-proof/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
