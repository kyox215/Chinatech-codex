name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run agents:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:risk-coverage
      - name: Report unused-code candidates (existing debt; not an automatic deletion gate)
        continue-on-error: true
        run: npx knip --reporter json > knip-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            coverage/risk
            knip-report.json
      - run: npm run build

  i18n-browser-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run required i18n browser stories
        run: >-
          npx playwright test --workers=1 --forbid-only --fail-on-flaky-tests --shard=${{ matrix.shard }}/4
          tests/e2e/i18n-language-switcher.spec.ts
          tests/e2e/i18n-orders-queue-release-a.spec.ts
          tests/e2e/i18n-public-states.spec.ts
          tests/e2e/i18n-scanner-camera-shell.spec.ts
          tests/e2e/i18n-orders-new-task-release-2b1.spec.ts
          tests/e2e/i18n-order-detail-release-2b2.spec.ts
          tests/e2e/global-compact-edit.spec.ts
          tests/e2e/order-detail-a-layout.spec.ts
          tests/e2e/orders-remediation-layout.spec.ts
          tests/e2e/order-detail-touch-workbench.spec.ts
          tests/e2e/order-bulk-transition-recovery.spec.ts
          tests/e2e/new-order-mobile-touch-reliability.spec.ts
          tests/e2e/app-style-recovery-runtime.spec.ts
          tests/e2e/app-style-recovery.spec.ts
          tests/e2e/i18n-customers-release-2b3.spec.ts
          tests/e2e/i18n-inventory-release-2b4.spec.ts
          tests/e2e/i18n-buyback-release-2b5.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3131
          PLAYWRIGHT_BROWSER: chromium
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "0"
          PLAYWRIGHT_WEBSERVER_COMMAND: REPAIRDESK_E2E_BUSINESS_DESKTOP=1 REPAIRDESK_BUYBACK_TRANSPARENT_QUOTE_WRITE_ENABLED=1 npx next dev -H 127.0.0.1 -p 3131
          REPAIRDESK_E2E_BUSINESS_DESKTOP: "1"
          REPAIRDESK_I18N_EVIDENCE_DIR: test-results/i18n-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-chromium-${{ matrix.shard }}
          path: |
            playwright-report
            test-results

  # Preserve one required gate; cancelled or failed shards must block the merge.
  i18n-browser:
    if: always()
    needs: i18n-browser-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every i18n shard to pass
        env:
          SHARD_RESULT: ${{ needs.i18n-browser-shard.result }}
        run: test "$SHARD_RESULT" = success
