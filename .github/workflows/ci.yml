name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      office-v3-test-db:
        image: postgres:17
        env:
          POSTGRES_DB: office_v3_test
          POSTGRES_PASSWORD: office_v3_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d office_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run test
      - name: Phone current-release cryptographic policies (JVM only)
        run: |
          mkdir -p .local/phone-gate-jvm
          javac -d .local/phone-gate-jvm android/phone-assistant/app/src/main/java/in/chinatech/phoneassistant/ProtocolCore.java android/phone-assistant/app/src/main/java/in/chinatech/phoneassistant/PhoneGateCore.java android/phone-assistant/app/src/main/java/in/chinatech/phoneassistant/PhoneRecoveryCore.java tests/android-phone-gate/PhoneGateCoreTest.java tests/android-phone-gate/PhoneRecoveryCoreTest.java
          java -cp .local/phone-gate-jvm in.chinatech.phoneassistant.PhoneGateCoreTest
          java -cp .local/phone-gate-jvm in.chinatech.phoneassistant.PhoneRecoveryCoreTest
          python3 tests/android-phone-gate-coordinator.test.py
      - name: Verify Office v3 migrations, RLS, candidate scope and request rate
        run: node tests/office-desktop-v3.sql.mjs
        env:
          OFFICE_V3_TEST_OWNER_URL: postgresql://postgres:office_v3_ci_fixture@127.0.0.1:5432/office_v3_test
      - run: npx playwright install --with-deps chromium webkit
      - name: Toolbox management component and identity recovery checks
        run: node tests/toolbox-control.ui.mjs
      - name: Shared feedback lifecycle and UI catalog checks
        run: node tests/ui-feedback.ui.mjs
      - name: Preserve shared feedback verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-feedback-proof
          path: .local/ui-feedback/
          if-no-files-found: error
      - name: Early site UI regression gate
        run: npx playwright test tests/browser/site-ui-recheck.spec.ts --reporter=line --output=.local/ui-proof/site-ui-smoke/test-results
      - name: Early color anchor regression gate
        run: npx playwright test tests/browser/controls.spec.ts --grep '(retail summary color follows common document scrolling and escapes only its open panel|retail creation color remains reachable across short-screen resize and form overflow|repair device color preserves short-screen internal scrolling and native selection)$' --reporter=line --output=.local/ui-proof/site-ui-smoke/color-anchor-results
      - name: Early repair feedback gate
        run: npx playwright test tests/browser/repair-feedback.spec.ts tests/browser/repair-list-ui.spec.ts --grep '(repair feedback three tabs retain all scoped purchases and orphan records|repair supplier pending-project controls stay inline and retain native form ownership|long synthetic models, suppliers and follow-up facts leave list controls readable and clickable|detail demand, parts and signature flow together independently of a tall sidebar)$' --reporter=line --output=.local/ui-proof/site-ui-smoke/repair-feedback-results
      - name: Early repair print source layout gate
        run: npx playwright test -c playwright.repair-print.config.ts --max-failures=1 --reporter=line,json --output=.local/ui-proof/repair-print-layout/early-source-test-results
        env:
          REPAIR_PRINT_PRODUCTION_CSS_DIR: ""
          REPAIR_PRINT_FONT_DIAGNOSTICS: "1"
          REPAIR_PRINT_EVIDENCE_DIR: .local/ui-proof/repair-print-layout/early-source-css
          PLAYWRIGHT_JSON_OUTPUT_FILE: .local/ui-proof/repair-print-layout/early-source-results.json
      - name: Early routed repair receipt consumers
        run: npx playwright test tests/browser/repair-detail-workspace.spec.ts tests/browser/repair-operations.spec.ts --grep '(missing project quote remains unknown in details, contact and receipt|intake quotes save per selected item, invalid decimals block, details and multilingual receipt agree)$' --reporter=line --output=.local/ui-proof/site-ui-smoke/repair-receipt-consumer-results
      - run: npm run build
        env:
          BACKEND_MODE: supabase
          LOCAL_PREVIEW: "0"
      - name: Verify packaged receipt runtime and Chromium PDF generation
        run: node scripts/verify-receipt-trace.mjs .next-backend .local/ui-proof/receipt-trace --render
      - name: Verify packaged exact Intl sort runtime
        run: node scripts/verify-native-sort-trace.mjs .next-backend .local/ui-proof/native-sort-trace
      - name: Verify production design and stylesheet order
        run: node scripts/check-ui-production.mjs .next-backend
      - run: npm run test:controls
        env:
          CT_PERF_BUILD_DIR: .next-backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: control-regression-results
          path: |
            test-results/
            .local/ui-feedback/
            .local/ui-proof/controls/
            .local/ui-proof/site-ui-smoke/
            .local/device-catalog/picker-performance-*.json
            .local/device-catalog/separated-performance-*.json
          include-hidden-files: true
          retention-days: 7
      - name: Preserve browser-native catalog measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-native-performance
          path: |
            .local/device-catalog/picker-performance-*.json
            .local/device-catalog/separated-performance-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Verify repair print layout against production CSS
        run: npx playwright test -c playwright.repair-print.config.ts
        env:
          REPAIR_PRINT_PRODUCTION_CSS_DIR: .next-backend/static
      - name: Preserve production design verification
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-design-verification
          path: |
            .local/ui-proof/production-design/
            .local/ui-proof/receipt-trace/verification.json
            .local/ui-proof/receipt-trace/**/packaged-runtime-demo.pdf
            .local/ui-proof/native-sort-trace/verification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve repair feedback and print layout proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-feedback-and-print-layout-proof
          path: |
            .local/ui-proof/repair-feedback/
            .local/ui-proof/repair-print-layout/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  native-sort-key-diagnostic:
    name: Public ICU sort-key diagnostic (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '24.21.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compare public ICU keys with the installed Intl comparator
        shell: bash
        run: |
          mkdir -p .local/native-sort-key-diagnostic-logs
          node tests/diagnostics/icu-sort-key/run-probe.mjs --run --expected-node=v${{ matrix.node }} --out=.local/native-sort-key-diagnostic 2>&1 | tee .local/native-sort-key-diagnostic-logs/run.log
      - name: Preserve the public diagnostic result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sort-key-diagnostic-node-${{ matrix.node }}
          path: |
            .local/native-sort-key-diagnostic/
            .local/native-sort-key-diagnostic-logs/
          if-no-files-found: error
