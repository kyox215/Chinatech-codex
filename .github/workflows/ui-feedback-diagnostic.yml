name: UI feedback Linux diagnostics
on:
  push:
    branches: [codex/ui-feedback-20261014]
    paths: [.github/workflows/ui-feedback-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: ui-feedback-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-style-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Collect six style variants with the original settings assertions
        run: node scripts/ui-feedback-linux-diagnostic.mjs
      - name: Preserve diagnostic outcomes, logs and browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-feedback-linux-style-ab
          path: .local/ui-feedback-linux-diagnostic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
