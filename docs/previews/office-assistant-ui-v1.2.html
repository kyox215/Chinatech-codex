 let body='',title='';if(S.modal==='install'){title='installTitle';body='<p class="modal-note">'+t('demoOperation')+'</p><p>'+t('installBody')+'</p>'+section('requested',S.selected)+section('willKeep',S.installed.filter(id=>!S.selected.includes(id)))+'<p>'+t('documents')+'</p><label class="terms-label"><input type="checkbox" id="terms" '+(S.terms?'checked':'')+'><span>'+t('terms')+'</span></label>';buttons('back','confirmStart',!S.terms)}
 if(S.modal==='activate'){title='activationTitle';body='<p class="modal-note">'+t('demoOperation')+'</p><p>'+t('activationBody')+'</p>'+section('requested',S.installed.filter(id=>id!=='onedrive'))+'<label class="terms-label"><input type="checkbox" id="terms" '+(S.terms?'checked':'')+'><span>'+t('terms')+'</span></label>';buttons('back','confirmStart',!S.terms)}
 if(S.modal==='remove'){title='removeTitle';const items=installedItems();body='<p class="modal-note">'+t('demoOperation')+'</p><div class="mode-buttons"><button id="remove-partial" class="'+(S.removeMode==='partial'?'selected':'')+'">'+t('partialMode')+'</button><button id="remove-all" class="'+(S.removeMode==='all'?'selected':'')+'">'+t('allMode')+'</button></div><p>'+t('removeBody')+'</p><h3>'+t('removeCount',{n:S.removeSelected.length})+'</h3><div class="removal-options">'+items.map(id=>'<label class="remove-option"><input type="checkbox" data-remove="'+id+'" '+(S.removeSelected.includes(id)?'checked':'')+'><span>'+encode(appName(id))+'</span></label>').join('')+'</div>'+(S.legacy?'<p class="modal-warning">'+t('legacyWarning')+'</p>':'')+(S.removeSelected.includes('onedrive')?'<p class="modal-warning">'+t('oneDriveWarning')+'</p>':'');buttons('back','next',!S.removeSelected.length)}
 if(S.modal==='removeConfirm'){title='removeConfirmTitle';const r=removalLists();body='<p class="modal-note">'+t('demoOperation')+'</p>'+section('willRemove',[...r.remove,...(r.lastSuite?['suite']:[])])+section('willKeep',r.kept)+'<ul><li>'+t('documents')+'</li></ul>'+(r.lastSuite?'<p class="modal-warning">'+t('lastSuiteWarning')+'</p>':'')+(r.remove.includes('onedrive')?'<p class="modal-warning">'+t('oneDriveWarning')+'</p>':'');buttons('back','confirmRemove',!r.remove.length)}
 if(S.modal==='inspection'){title='inspectionDetails';body=(!S.inspectionOk?'<p class="modal-warning">'+t('unknownInspection')+'</p>':'')+'<div class="inspection-list"><div><span>Windows</span><strong>Windows 11</strong></div><div><span>'+t('architecture')+'</span><strong>x64</strong></div><div><span>'+t('version')+'</span><strong>'+(!S.inspectionOk?t('unknown'):hasOffice()?'16.0.17932.21000':S.legacy?'16.0 (MSI)':'—')+'</strong></div><div><span>'+t('license')+'</span><strong>'+(!S.inspectionOk?t('unknown'):hasOffice()?t(S.licensed?'licensed':'unlicensed'):t('notApplicable'))+'</strong></div></div>'+section(S.inspectionOk?'detectedItems':'previousObservation',installedItems());buttons('close',null)}
 if(S.modal==='task'){title='taskDetails';const task=S.task;body='<p class="modal-note">'+t('demoOperation')+'</p>'+(task?'<div class="inspection-list"><div><span>'+t('taskType')+'</span><strong>'+t(task.kind==='install'?'taskInstall':task.kind==='activate'?'taskActivate':'taskRemove')+'</strong></div><div><span>'+t('installationLocale')+'</span><strong>'+{zh:'中文',it:'Italiano',en:'English'}[task.installationLanguage]+'</strong></div></div>'+section('taskSnapshot',task.requested)+'<h3>'+t('logs')+'</h3><div class="log">'+encode(task.log.map(k=>t(k)).join('\n'))+'</div>':'<p>'+t('noTask')+'</p>');buttons('close',null)}
 $('modal-title').textContent=t(title);modalBody.innerHTML=body;modalBody.scrollTop=offset;
 if(focused&&!$('modal').hidden){const control=focused.id?$(focused.id):focused.removal?modalBody.querySelector('[data-remove="'+focused.removal+'"]'):null;if(control&&!control.disabled)control.focus({preventScroll:true});}
}
function toast(key){clearTimeout(toastTimeout);$('toast').textContent=t(key);$('toast').hidden=false;toastTimeout=setTimeout(()=>{$('toast').hidden=true;toastTimeout=null},2800)}
function startTask(kind,requested){if(blocked()||!requested.length)return;stopTimer();closeModal();S.busy=true;S.outcome=null;S.task={kind,requested:[...requested],installationLanguage:S.installationLanguage,existing:[...S.installed],existingExtras:[...S.extras],existingLegacy:S.legacy,phase:0,elapsed:0,log:[kind==='remove'?'phaseRemove':kind==='activate'?'phaseActivate':'phasePrepare']};render();interval=setInterval(()=>{S.task.elapsed++;const phase=Math.min(3,Math.floor(S.task.elapsed/2));if(phase!==S.task.phase){S.task.phase=phase;S.task.log.push(kind==='remove'?'phaseRemove':kind==='activate'?'phaseActivate':['phasePrepare','phaseDownload','phaseInstall','phaseVerify'][phase])}if(S.task.elapsed>=8){finishTask();return}render()},1000)}
function finishTask(){stopTimer();const task=S.task;if(task.kind==='install'){S.installed=[...new Set([...task.existing,...task.requested])];S.licensed=hasOffice();S.outcome='installed';S.scenario='ready'}else if(task.kind==='activate'){S.licensed=true;S.outcome='activated';S.scenario='ready'}else{S.installed=task.existing.filter(id=>!task.requested.includes(id));S.extras=task.existingExtras.filter(id=>!task.requested.includes(id));S.legacy=task.existingLegacy&&!task.requested.includes('legacy');if(!hasOffice())S.licensed=false;S.outcome='removed';S.scenario=S.legacy?'legacy':S.installed.length?'partial':'empty'}task.log.push(task.kind==='remove'?'removed':'finished');S.busy=false;S.inspectionOk=true;render()}
function refresh(){if(S.busy)return;if(!S.inspectionOk){S.inspectionOk=true;S.scenario='partial';toast('inspectionRecovered')}else if(S.restart){toast('restartStillRequired')}else toast('refreshed');render()}
function exportReport(){closeMenu();const report={demo:true,realOfficeOperation:false,language:S.language,scenario:S.scenario,inspectionOk:S.inspectionOk,installed:S.inspectionOk?installedItems():null,previousSuccessfulInspection:S.inspectionOk?undefined:installedItems(),selected:[...S.selected],task:S.task?JSON.parse(JSON.stringify(S.task)):null};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ChinaTech-Office-1.2-Preview-Report.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('exported')}
$('locale').addEventListener('change',e=>{S.language=e.target.value;render()});$('scenario').addEventListener('change',e=>setScenario(e.target.value));for(const id of ['install-language','compact-install-language'])$(id).addEventListener('change',e=>{if(blocked())return;S.installationLanguage=e.target.value;render()});$('apps').addEventListener('change',e=>{if(!e.target.dataset.app||blocked())return;S.selected=e.target.checked?[...new Set([...S.selected,e.target.dataset.app])]:S.selected.filter(id=>id!==e.target.dataset.app);render();$('app-'+e.target.dataset.app).focus()});$('select-all').addEventListener('click',()=>{if(blocked())return;S.selected=apps.map(a=>a.id);render()});$('clear-all').addEventListener('click',()=>{if(blocked())return;S.selected=[];render()});$('primary').addEventListener('click',()=>openModal($('primary').dataset.action));$('more').addEventListener('click',()=>{$('menu').hidden?openMenu():closeMenu()});$('activate').addEventListener('click',()=>openModal('activate'));$('uninstall').addEventListener('click',()=>openModal('remove'));$('export').addEventListener('click',exportReport);$('refresh').addEventListener('click',refresh);$('cancel').addEventListener('click',()=>{if(!S.busy)return;stopTimer();S.busy=false;S.outcome='cancelled';S.task.log.push('cancelled');render()});$('computer-details').addEventListener('click',()=>openModal('inspection'));$('task-details').addEventListener('click',()=>openModal('task'));$('modal-close').addEventListener('click',()=>closeModal());
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();if(e.target.id==='dialog-back'){if(S.modal==='removeConfirm'){S.modal='remove';renderModal();$('modal-close').focus();syncState()}else closeModal()}if(e.target.id==='dialog-next'){if(S.modal==='remove'){S.modal='removeConfirm';renderModal();$('modal-close').focus();syncState()}else if(S.modal==='removeConfirm'){startTask('remove',removalLists().remove)}else if(S.modal==='install'&&S.terms){startTask('install',S.selected)}else if(S.modal==='activate'&&S.terms){startTask('activate',S.installed.filter(id=>id!=='onedrive'))}}if(e.target.id==='remove-all'||e.target.id==='remove-partial'){S.removeMode=e.target.id==='remove-all'?'all':'partial';S.removeSelected=S.removeMode==='all'?installedItems().filter(id=>id!=='onedrive'):[];renderModal();$(e.target.id).focus();syncState()}});
$('modal').addEventListener('change',e=>{if(e.target.id==='terms'){S.terms=e.target.checked;$('dialog-next').disabled=!S.terms;syncState()}if(e.target.dataset.remove){const id=e.target.dataset.remove;S.removeSelected=e.target.checked?[...new Set([...S.removeSelected,id])]:S.removeSelected.filter(x=>x!==id);const focusId=id;renderModal();$('modal-body').querySelector('[data-remove="'+focusId+'"]').focus();syncState()}});
document.addEventListener('pointerdown',e=>{if(!$('menu').hidden&&!$('menu').contains(e.target)&&!$('more').contains(e.target))closeMenu(false)});document.addEventListener('keydown',e=>{if(!$('modal').hidden){if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key==='Tab'){const focus=[...$('modal').querySelectorAll('button,input,select')].filter(el=>!el.disabled&&el.getClientRects().length);const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(!$('menu').hidden){const focus=[...$('menu').querySelectorAll('button')].filter(b=>!b.disabled);if(e.key==='Escape'){e.preventDefault();closeMenu()}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const at=focus.indexOf(document.activeElement);focus[(at+(e.key==='ArrowDown'?1:-1)+focus.length)%focus.length].focus()}if(e.key==='Tab')closeMenu(false)}});window.addEventListener('resize',()=>{if(!$('menu').hidden)positionMenu()});window.addEventListener('scroll',()=>{if(!$('menu').hidden)positionMenu()},{passive:true});window.addEventListener('pagehide',()=>{stopTimer();clearTimeout(toastTimeout)});window.previewApi={setScenario,getState:()=>JSON.parse(JSON.stringify(window.previewState))};render();
</script>
